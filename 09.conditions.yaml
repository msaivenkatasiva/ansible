- name: conditions
  hosts: localhost
  become: yes
  tasks:
  - name: check roboshop user exists or not
    ansible.builtin.command: id roboshop
    register: user
    ignore_errors: true

  - name: print the variable value
    ansible.builtin.debug:
      msg: "user output:: is {{user}}"

  - name: check the exit status
    ansible.builtin.debug:
      msg: "user status is: {{user.rc}}"

  - name: create user
    ansible.builtin.user:
      name: roboshop
    when: user.rc != 0
